<div class="container my-3">
  <div class="row g-3">
    @for (pokm of Pokemon(); track pokm) {
      <div class="col-md-6 col-lg-2">
        <div class="card p-3 text-center">
          <span class="fs-6 fw-medium card-title">{{ paraTitleCase(pokm.name) }}</span>

          <div class="d-flex justify-content-center gap-2">
            @for (tipo of pokm.types; track tipo) {
              <span class="badge roundedpill text-light">{{ paraTitleCase(tipo) }}</span>
            }
          </div>

          @if (pokm.sprite) {
            <img [src]="pokm.sprite" [alt]="pokm.name" />
          } @else {
            <p>Imagem não disponivel</p>
          }
        </div>
      </div>
    }
  </div>
</div>
